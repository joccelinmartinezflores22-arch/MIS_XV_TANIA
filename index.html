<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis XV Años - Invitación</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Great+Vibes&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --azul-rey: #0047AB;
            --dorado: #D4AF37;
        }
        body { font-family: 'Montserrat', sans-serif; background-color: #fdfdfd; color: #333; }
        
        .hero {
            background: linear-gradient(rgba(0, 71, 171, 0.6), rgba(0, 35, 102, 0.8)), 
                        url('https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1200&q=80'); /* Cambia por tu foto */
            height: 90vh;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }
        
        h1 { font-family: 'Great Vibes', cursive; font-size: 5rem; color: var(--dorado); }
        .fecha { font-family: 'Cinzel', serif; font-size: 1.5rem; letter-spacing: 3px; }
        
        .section-padding { padding: 60px 20px; }
        .btn-confirmar {
            background-color: var(--azul-rey);
            color: white;
            border: 2px solid var(--dorado);
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            text-decoration: none;
            transition: 0.3s;
        }
        .btn-confirmar:hover { background-color: #003380; color: var(--dorado); }
        
        .card-evento {
            border: 1px solid var(--azul-rey);
            border-radius: 15px;
            padding: 30px;
            margin: 10px;
            background: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <header class="hero">
        <div>
            <p class="fecha">Mis Quince Años</p>
            <h1>Daniela</h1>
            <p class="h4">15 de Mayo, 2026</p>
        </div>
    </header>

    <main class="container text-center section-padding">
        <h2 style="color: var(--azul-rey);">¡Acompáñame!</h2>
        <p class="lead mb-5">Será una noche mágica y tú eres parte fundamental de ella.</p>

        <div class="row">
            <div class="col-md-6">
                <div class="card-evento">
                    <h3 style="color: var(--azul-rey);">Ceremonia</h3>
                    <p>17:00 hrs <br> Parroquia de Nuestra Señora</p>
                    <a href="#" class="btn btn-sm btn-outline-primary">Ver Ubicación</a>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card-evento">
                    <h3 style="color: var(--azul-rey);">Recepción</h3>
                    <p>20:00 hrs <br> Salón Gema Real</p>
                    <a href="#" class="btn btn-sm btn-outline-primary">Ver Ubicación</a>
                </div>
            </div>
        </div>

        <div class="mt-5 pt-5">
            <a href="https://wa.me/TUNUMEROTELEFONO?text=Hola!%20Confirmo%20mi%20asistencia" class="btn-confirmar">
                Confirmar por WhatsApp
            </a>
        </div>
    </main>

</body>
</html>
